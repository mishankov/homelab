[routes]
chat = "openai/gpt-6.1-terra"
background = "openai/gpt-6.1-terra"
analysis = "openai/gpt-6.1-terra"

[providers.openai]
adapter = "openai_chatgpt"
base_url = "http://127.0.0.1:8765/v1"
default_capabilities = ["tools", "vision", "structured_output"]
default_context_window_tokens = 1050000
default_max_output_tokens = 8192
default_timeout = "120s"

[providers.opencode-go]
adapter = "openai_chat_completions"
base_url = "https://opencode.ai/inference/go/openai/v1"
api_key_env = "LLM_API_KEY"
default_capabilities = ["tools", "vision", "structured_output"]
default_context_window_tokens = 1000000
default_max_output_tokens = 8192
default_timeout = "120s"

[providers.opencode-go.default_options]
include_reasoning_content = true
session_header = "x-opencode-session"

[models."openai/gpt-6.2-sol"]
display_name = "GPT-6.2-Sol"

[models."opencode-go/deepseek-v4.1-flash"]
