services:
  setup-elk:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.0
    container_name: homelab-setup-elk
    restart: no
    environment:
      ELASTIC_PASSWORD: elastic
      KIBANA_PASSWORD: kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    command: >
      bash -c '
        until curl -fsS -u "elastic:$${ELASTIC_PASSWORD}" -H "Content-Type: application/json" -X POST http://elasticsearch:9200/_security/user/kibana_system/_password -d "{\"password\":\"$${KIBANA_PASSWORD}\"}";
        do
          echo "Waiting for the Elasticsearch security index...";
          sleep 5;
        done
      '
