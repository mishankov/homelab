services:
  setup-elk:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.0
    container_name: homelab-setup-elk
    restart: no
    environment:
      ELASTIC_PASSWORD: elastic
      KIBANA_PASSWORD: kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    command: >
      bash -c '
        until curl -fsS -u "elastic:$${ELASTIC_PASSWORD}" -H "Content-Type: application/json" -X POST http://elasticsearch:9200/_security/user/kibana_system/_password -d "{\"password\":\"$${KIBANA_PASSWORD}\"}";
        do
          echo "Waiting for the Elasticsearch security index...";
          sleep 5;
        done
      '

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.0
    container_name: homelab-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.autoconfiguration.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      cluster.routing.allocation.disk.watermark.low: 10gb
      cluster.routing.allocation.disk.watermark.high: 5gb
      cluster.routing.allocation.disk.watermark.flood_stage: 2gb
      ELASTIC_PASSWORD: elastic
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - ../data/elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -u elastic:elastic 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null",
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.0
    container_name: homelab-kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: kibana
    ports:
      - 5601:5601
    depends_on:
      elasticsearch:
        condition: service_healthy
