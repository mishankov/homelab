services:
  postgresql:
    image: ghcr.io/mishankov/postgres-pljava-openjdk:sha-19afbfa
    container_name: homelab-postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 10s
      retries: 120
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    expose:
      - 5432
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgresql:/var/lib/postgresql
