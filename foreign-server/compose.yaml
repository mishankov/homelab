name: foreign-server

services:
  llm-meter:
    image: ghcr.io/mishankov/llm-meter:latest
    restart: unless-stopped
    environment:
      DASHBOARD_TOKEN: "${DASHBOARD_TOKEN:?Set DASHBOARD_TOKEN in the private env file}"
      COOKIE_SECURE: "true"
    volumes:
      - llm-meter-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    environment:
      LLM_METER_ADDRESS: "${LLM_METER_ADDRESS:?Set LLM_METER_ADDRESS in the private env file}"
    depends_on:
      llm-meter:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  llm-meter-data:
    external: true
    name: llm-proxy-data
  caddy-data:
  caddy-config:
