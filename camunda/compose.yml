services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: homelab-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - ../data/camunda/elasticsearch:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  camunda-zeebe:
    image: camunda/zeebe:8.5.25
    container_name: homelab-camunda-zeebe
    restart: unless-stopped
    environment:
      ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_CLASSNAME: io.camunda.zeebe.exporter.ElasticsearchExporter
      ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_URL: http://elasticsearch:9200
      ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_BULK_SIZE: 1
      ZEEBE_BROKER_DATA_DISKUSAGECOMMANDWATERMARK: "0.998"
      ZEEBE_BROKER_DATA_DISKUSAGEREPLICATIONWATERMARK: "0.999"
      JAVA_TOOL_OPTIONS: -Xms512m -Xmx512m
    ports:
      - "26500:26500"
      - "127.0.0.1:9600:9600"
    volumes:
      - ../data/camunda/zeebe:/usr/local/zeebe/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "timeout 10s bash -c ':> /dev/tcp/127.0.0.1/9600' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      elasticsearch:
        condition: service_healthy

  camunda-operate:
    image: camunda/operate:8.5.22
    container_name: homelab-camunda-operate
    restart: unless-stopped
    environment:
      CAMUNDA_OPERATE_ZEEBE_GATEWAYADDRESS: camunda-zeebe:26500
      CAMUNDA_OPERATE_ELASTICSEARCH_URL: http://elasticsearch:9200
      CAMUNDA_OPERATE_ZEEBEELASTICSEARCH_URL: http://elasticsearch:9200
      CAMUNDA_OPERATE_CSRFPREVENTIONENABLED: "false"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    ports:
      - "8083:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -O - -q http://localhost:8080/actuator/health/readiness",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      camunda-zeebe:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
